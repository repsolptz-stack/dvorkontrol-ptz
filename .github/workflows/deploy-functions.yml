name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync standalone functions
        run: |
          mkdir -p supabase/functions/list-reports supabase/functions/create-report supabase/functions/upload-photo
          cp supabase/functions-standalone/list-reports/index.ts supabase/functions/list-reports/index.ts
          cp supabase/functions-standalone/create-report/index.ts supabase/functions/create-report/index.ts
          cp supabase/functions-standalone/upload-photo/index.ts supabase/functions/upload-photo/index.ts

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
                run: |
        supabase link --project-ref "$SUPABASE_PROJECT_ID"
        supabase functions deploy list-reports --no-verify-jwt --yes
        supabase functions deploy create-report --no-verify-jwt --yes
        supabase functions deploy upload-photo --no-verify-jwt --yes

